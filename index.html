<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thali for Two</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#E9EEE5; --surface:#FFFFFF; --surface2:#F3F6F0; --ink:#16211B; --muted:#56655B;
  --line:#D3DBCF; --leaf:#1D573A; --leafInk:#FFFFFF; --prot:#B9780A; --fib:#2B7A4B;
  --warn:#A3362A; --chip:#DFE7D9; --protBg:#FBF0DA; --fibBg:#E1F0E6;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111814; --surface:#19221D; --surface2:#1F2A24; --ink:#E4ECE6; --muted:#9AAA9F;
    --line:#2D3A32; --leaf:#74C394; --leafInk:#0F1A14; --prot:#F0B23C; --fib:#62C287;
    --warn:#F08A7A; --chip:#25312A; --protBg:#3A2E14; --fibBg:#18352A;
  }
}
:root[data-theme="dark"]{
  --bg:#111814; --surface:#19221D; --surface2:#1F2A24; --ink:#E4ECE6; --muted:#9AAA9F;
  --line:#2D3A32; --leaf:#74C394; --leafInk:#0F1A14; --prot:#F0B23C; --fib:#62C287;
  --warn:#F08A7A; --chip:#25312A; --protBg:#3A2E14; --fibBg:#18352A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.15;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--prot);outline-offset:2px;border-radius:6px}
a{color:var(--leaf)}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 110px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 0 18px}
header.top h1{font-size:2rem;font-weight:800;letter-spacing:-.02em}
header.top p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--leaf);color:var(--leafInk);font-weight:700;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--leaf);border:1.5px solid var(--leaf)}
.btn.small{padding:6px 10px;font-size:.85rem;border-radius:8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{display:flex;max-width:760px;width:100%}
nav.tabs button{flex:1;background:none;border:0;padding:10px 4px 12px;font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--leaf);font-weight:700}
.summary{background:var(--surface);border-radius:18px;padding:16px;margin-bottom:18px;border:1px solid var(--line)}
.summary h2{font-size:1.1rem;margin-bottom:10px}
.sumgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sumgrid div{background:var(--surface2);border-radius:12px;padding:10px 12px}
.sumgrid b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.25rem}
.sumgrid span{font-size:.82rem;color:var(--muted)}
.persons{width:100%;border-collapse:collapse;margin-top:12px;font-size:.9rem}
.persons th,.persons td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.persons th{color:var(--muted);font-weight:400}
.ok{color:var(--fib);font-weight:700}.short{color:var(--warn);font-weight:700}
.day{background:var(--surface);border-radius:20px;margin-bottom:16px;border:1px solid var(--line);overflow:hidden}
.dayhead{display:flex;align-items:center;gap:14px;padding:14px 16px 10px}
.dayhead h3{font-size:1.35rem;font-weight:700}
.dayhead .sub{color:var(--muted);font-size:.85rem}
.ring{flex:none}
.ring text{font-family:"Bricolage Grotesque",sans-serif;font-weight:700}
.meal{border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;align-items:start}
.meal-main{background:none;border:0;text-align:left;padding:12px 8px 12px 16px;width:100%}
.slot{display:block;font-size:.8rem;color:var(--muted)}
.mname{display:block;font-weight:700;line-height:1.3;margin:1px 0 5px}
.mmeta{display:flex;flex-wrap:wrap;gap:6px;font-size:.78rem}
.tag{padding:2px 8px;border-radius:999px;background:var(--chip)}
.tag.p{background:var(--protBg);color:var(--prot);font-weight:700}
.tag.f{background:var(--fibBg);color:var(--fib);font-weight:700}
.tag.lo{background:transparent;border:1px dashed var(--muted)}
.swap{background:none;border:0;padding:14px 16px 10px 8px;color:var(--muted)}
.swap svg{width:22px;height:22px}
.details{grid-column:1/-1;padding:4px 16px 16px;background:var(--surface2)}
.details h4{margin:12px 0 6px;font-size:.9rem}
.nut{width:100%;border-collapse:collapse;font-size:.85rem}
.nut td,.nut th{padding:4px 6px;text-align:right;border-bottom:1px solid var(--line)}
.nut th:first-child,.nut td:first-child{text-align:left}
.details ul,.details ol{margin:0;padding-left:20px;font-size:.9rem}
.note{font-size:.85rem;color:var(--muted);margin:8px 0 0}
.hint{margin:0 16px 14px;padding:10px 12px;border-radius:12px;background:var(--protBg);font-size:.85rem}
.hint.fib{background:var(--fibBg)}
.section{background:var(--surface);border-radius:18px;padding:16px;margin-bottom:16px;border:1px solid var(--line)}
.section h2{font-size:1.25rem;margin-bottom:4px}
.section > p{margin:0 0 12px;color:var(--muted);font-size:.9rem}
.gcat{margin:14px 0 4px;font-size:.95rem;font-family:"Bricolage Grotesque",sans-serif}
.gitem{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.gitem input{width:20px;height:20px;accent-color:var(--leaf)}
.gitem .gn{line-height:1.25}
.gitem .gq{font-size:.82rem;color:var(--muted)}
.gitem.have .gn{text-decoration:line-through;color:var(--muted)}
.shop{display:flex;gap:6px}
.shop a{font-size:.75rem;text-decoration:none;padding:5px 8px;border-radius:8px;border:1px solid var(--line);color:var(--ink);background:var(--surface2);white-space:nowrap}
.gtotal{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 4px;font-weight:700}
.gtotal b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.4rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:999px;background:var(--chip);font-size:.88rem}
.chip.used{background:var(--leaf);color:var(--leafInk)}
.steps{list-style:none;padding:0;margin:0}
.steps li{padding:10px 0;border-bottom:1px solid var(--line)}
.steps li b{display:block}
.steps .when{font-size:.8rem;color:var(--muted)}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-size:.85rem;color:var(--muted)}
.field input,.field select{padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface2);padding:9px 6px;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--leaf);color:var(--leafInk);font-weight:700}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.switch input{width:22px;height:22px;accent-color:var(--leaf)}
input[type=range]{width:100%;accent-color:var(--leaf)}
.rangelbl{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.person{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.person h3{font-size:1rem;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
.fine{font-size:.8rem;color:var(--muted)}
.hint.vc{background:var(--surface2);border:1px solid var(--line)}
.chip{border:0}.chip.fav{background:var(--prot);color:#fff}.chip.skip{text-decoration:line-through;opacity:.6}
button.chip{cursor:pointer}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--protBg);border-radius:14px;padding:10px 12px;margin-bottom:14px;font-size:.9rem}
.addon{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.addon input[type=checkbox]{width:20px;height:20px;accent-color:var(--leaf)}
.addon .am{font-size:.8rem;color:var(--muted)}
.addon .ctl{grid-column:2/-1;display:flex;gap:8px;flex-wrap:wrap}
.addon .ctl select{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-size:.85rem}
.linkbtn{background:none;border:0;color:var(--warn);font-size:.85rem;padding:4px}
textarea{font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);width:100%;min-height:80px;color:inherit}
details.more summary{cursor:pointer;color:var(--leaf);font-weight:700;padding:8px 0}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media (min-width:700px){
  .sumgrid{grid-template-columns:repeat(4,1fr)}
  header.top h1{font-size:2.5rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    if(g.u==='pc') v+=q*VC[real]/2; else v+=(q/2)*VC[real]/100*(g.cat==='fruit'||real==='cucumber'||real==='mint'?1:(r.slot==='s'?0.9:0.5));});
  return Math.round(v);
}
function pickProduce(kind,days,d){
  const flag=kind==='veg'?'sabzi':'fruit';
  let list=Object.keys(ING).filter(id=>ING[id][flag]&&inSeason(id));
  if(S.save>0.65){const cheap=list.filter(id=>ING[id].pr<=150); if(cheap.length) list=cheap;}
  const near=new Set();
  days.forEach((day,i)=>{if(!day||Math.abs(i-d)>1)return; SLOTS.forEach(k=>{const it=day[k]; if(it&&it[kind]) near.add(it[kind]);});});
  let pool=list.filter(x=>!near.has(x)); if(!pool.length) pool=list;
  if(!pool.length) return kind==='veg'?'cabbage':'banana';
  const w=pool.map(x=>S.prefs[x]===1?3:1), tot=w.reduce((a,b)=>a+b,0); let r=Math.random()*tot;
  for(let i=0;i<pool.length;i++){r-=w[i]; if(r<=0) return pool[i];}
  return pool[0];
}
function targets(p){return {p:Math.round(p.w*p.g), f:p.fib, vc:p.vc};}
function activeAddons(key){return (S.addons||[]).filter(a=>a.on&&(a.who==='both'||a.who===key)&&(!a.m||a.m.includes(S.month)));}
function addonTotals(key){return activeAddons(key).reduce((t,a)=>{t.p+=a.p*a.per;t.f+=a.f*a.per;t.k+=a.k*a.per;t.vc+=a.vc*a.per;return t;},{p:0,f:0,k:0,vc:0});}
function pickFor(days,d,k,rng,exclude){
  const slot=k==='b'?'b':k==='s'?'s':'m';
  const wk=d<5;
  let cap=slot==='b'?Math.min(S.cap,20):slot==='s'?15:S.cap;
  if(k==='l'&&S.leftover&&d===0) cap=Math.min(cap,25);
  let c=ALLR.filter(r=>r.slot===slot&&dietOK(r,S.diet)&&recipeOK(r)&&r.id!==exclude);
  if(!c.length) c=ALLR.filter(r=>r.slot===slot&&dietOK(r,S.diet)&&r.id!==exclude);
  let c2=wk?c.filter(r=>r.time<=cap):c; if(!c2.length) c2=c;
  const used={},last={}; let nonveg=0;
  days.forEach((day,i)=>{if(!day)return; SLOTS.forEach(kk=>{ if(i===d&&kk===k)return; const it=day[kk]; if(!it)return;
    used[it.rid]=(used[it.rid]||0)+1;
    if(last[it.rid]===undefined||Math.abs(i-d)<Math.abs(last[it.rid]-d)) last[it.rid]=i;
    if(RX[it.rid].diet==='nonveg'&&!it.leftover) nonveg++; });});
  const today=days[d]||{};
  const pks=SLOTS.filter(kk=>kk!==k&&today[kk]).map(kk=>RX[today[kk].rid].pk);
  let gapP=0,gapF=0;
  if(slot==='s'){
    const t=['b','l','d'].reduce((a,kk)=>{const it=today[kk]; if(it){a.p+=RX[it.rid].p;a.f+=RX[it.rid].f;} return a;},{p:0,f:0});
    const gp=key=>{const tg=targets(S[key]),ad=addonTotals(key);return [(tg.p-ad.p)/S[key].f-t.p,(tg.f-ad.f)/S[key].f-t.f];};
    const A=gp('a'),B=gp('b'); gapP=Math.max(A[0],B[0]); gapF=Math.max(A[1],B[1]);
  }
  let best=null,bs=-1e9;
  c2.forEach(r=>{
    let sc=r.p*1.2+r.f*1.6+rng()*12;
    sc-=costPerPlate(r)*(0.04+0.4*S.save);
    sc-=(used[r.id]||0)*(10+22*(1-S.save));
    if(last[r.id]!==undefined&&Math.abs(d-last[r.id])<=1) sc-=35;
    if(pks.includes(r.pk)) sc-=25;
    if(r.m) sc+=6;
    if(r.custom) sc+=(used[r.id]?6:30);
    if(r.ing.some(([id])=>S.prefs[id]===1)) sc+=10;
    if(r.diet==='nonveg'){sc+=3; if(nonveg>=4) sc-=45;}
    if(slot==='s'){ if(gapP>10) sc+=r.p*3; else sc-=r.p*0.5; if(gapF>6) sc+=r.f*2; }
    if(sc>bs){bs=sc;best=r;}
  });
  const it={rid:best.id};
  if(best.ing.some(x=>x[0]==='$veg')) it.veg=pickProduce('veg',days,d);
  if(best.ing.some(x=>x[0]==='$fruit')) it.fruit=pickProduce('fruit',days,d);
  return it;
}
function generate(){
  const seed=(Math.random()*1e9)|0, rng=mulberry32(seed);
  const days=[];
  for(let d=0;d<7;d++){
    days[d]={};
    SLOTS.forEach(k=>{
      if(k==='l'&&S.leftover&&d>0) days[d].l={...days[d-1].d,leftover:true};
      else days[d][k]=pickFor(days,d,k,rng);
    });
  }
  P={seed,days}; CHECK={}; OPEN=null; DIRTY=false; save();
}
function swap(d,k,silent){
  const days=P.days, cur=days[d][k];
  const it=pickFor(days,d,k,Math.random,cur.leftover?null:cur.rid);
  days[d][k]=it;
  if(k==='d'&&S.leftover&&d<6&&days[d+1].l&&days[d+1].l.leftover) days[d+1].l={...it,leftover:true};
  if(k==='l'&&cur.leftover){} // lunch now cooked fresh
  save(); render(); if(!silent) toast('Swapped '+SLOTNAME[k].toLowerCase());
}

/* ---------- calculations ---------- */
const mealName=it=>{const r=RX[it.rid];return r.name.replace('{veg}',it.veg?ING[it.veg].s:'seasonal').replace('{fruit}',it.fruit?ING[it.fruit].s:'fruit');};
function multFor(d,k){ let m=(S.a.f+S.b.f)/2; if(k==='d'&&P.days[d+1]&&P.days[d+1].l&&P.days[d+1].l.leftover) m*=2; return m; }
function resolve(id,it){return id==='$veg'?it.veg:id==='$fruit'?it.fruit:id;}
function fmtQty(id,q){
  const u=ING[id].u||'g';
  if(u==='pc') return Math.ceil(q-0.01)+(id==='eggs'?' eggs':id==='bread'?' slices':' pcs');
  if(u==='ml') return q>=1000?(Math.round(q/250)/4)+' L':Math.max(50,Math.round(q/50)*50)+' ml';
  return q>=1000?(Math.round(q/100)/10)+' kg':Math.max(25,Math.round(q/25)*25)+' g';
}
const priceOf=(id,q)=>{const g=ING[id];return g.u==='pc'?q*g.pr:q/1000*g.pr;};
function dayMeals(day){const t={p:0,f:0,k:0,c:0,fat:0,vc:0,time:0};SLOTS.forEach(k=>{const it=day[k];const r=RX[it.rid];t.p+=r.p;t.f+=r.f;t.k+=r.k;t.c+=+r.c||0;t.fat+=+r.fat||0;t.vc+=vcOf(r,it);if(!it.leftover)t.time+=r.time;});return t;}
function personDay(t,key){const f=S[key].f,a=addonTotals(key);return {p:t.p*f+a.p,f:t.f*f+a.f,k:t.k*f+a.k,vc:t.vc*f+a.vc};}
function parseIng(line){
  const m=line.trim().match(/^(.*?)[,:\-]?\s+([\d.]+)\s*(kg|g|ml|l|ltr|pcs?|pieces?|nos?)?\.?$/i);
  if(!m) return {name:line.trim(),qty:null,unit:''};
  let u=(m[3]||'').toLowerCase(); if(/^p|^n/.test(u)) u='pcs'; if(u==='ltr') u='l';
  return {name:m[1].trim().replace(/[,:\-]$/,''),qty:parseFloat(m[2]),unit:u};
}
function groceries(){
  const tot={}, custom={};
  P.days.forEach((day,d)=>SLOTS.forEach(k=>{const it=day[k]; if(it.leftover)return; const m=multFor(d,k); const r=RX[it.rid];
    if(r.custom){(r.ingC||[]).forEach(x=>{const key=(x.name+'|'+x.unit).toLowerCase(); const c=custom[key]=custom[key]||{name:x.name,unit:x.unit,qty:0,hasQty:x.qty!=null}; if(x.qty!=null) c.qty+=x.qty*m;}); return;}
    r.ing.forEach(([id,q])=>{const real=resolve(id,it); tot[real]=(tot[real]||0)+q*m;});}));
  let customCost=0; P.days.forEach((day,d)=>SLOTS.forEach(k=>{const it=day[k]; const r=RX[it.rid]; if(r.custom&&!it.leftover) customCost+=costPerPlate(r)*multFor(d,k)*2;}));
  const adds=[]; (S.addons||[]).forEach(a=>{ if(!a.on||(a.m&&!a.m.includes(S.month)))return; const n=7*a.per*(a.who==='both'?2:1); adds.push({a,n,cost:n*a.cost}); });
  return {tot,custom:Object.values(custom),customCost,adds};
}
function fmtCustomQty(c){ if(!c.hasQty) return 'as per recipe'; const q=c.qty; if(c.unit==='g'&&q>=1000) return (Math.round(q/100)/10)+' kg'; if(c.unit==='ml'&&q>=1000) return (Math.round(q/100)/10)+' L'; return (Math.round(q*10)/10)+' '+(c.unit||''); }
function topUp(gap){
  const o=[{t:'25 g soya chunks in a sabzi',p:13},{t:'2 boiled eggs',p:12,egg:1},{t:'50 g paneer',p:9},{t:'1 glass milk',p:6},{t:'30 g roasted chana',p:6},{t:'150 g curd',p:5}].filter(x=>!x.egg||S.diet!=='veg');
  const whey=(S.addons||[]).find(a=>a.id==='whey');
  if(whey&&!whey.on&&gap>=15) o.unshift({t:'1 scoop whey',p:24});
  const out=[]; let g=gap;
  while(g>2&&out.length<2){ const pick=o.find(x=>x.p<=g+4&&!out.includes(x))||o.filter(x=>!out.includes(x)).slice(-1)[0]; out.push(pick); g-=pick.p; }
  return out.map(x=>`${x.t} (+${x.p} g)`).join(' or ');
}
function vcSources(){
  return VC_SRC.filter(x=>inSeason(x.id)||x.id==='lemon'||x.id==='papaya').map(x=>({...x,mg:Math.round(x.pc?x.pc*VC[x.id]:x.g*VC[x.id]/100)})).sort((a,b)=>b.mg-a.mg);
}

  if(G.adds.length){h+=`<h3 class="gcat">Daily add-ons</h3>`;
    G.adds.forEach(({a,n,cost})=>{const id='a:'+a.id; const have=!!CHECK[id]; total+=cost; if(!have) need+=cost;
      h+=`<div class="gitem ${have?'have':''}"><input type="checkbox" data-act="check" data-id="${esc(id)}" ${have?'checked':''} aria-label="I already have ${esc(a.name)}"><div><div class="gn">${esc(a.name.split(',')[0])}</div><div class="gq">${n} servings this week${a.g?' (about '+Math.round(n*a.g)+' g)':''}, about ₹${Math.round(cost)}</div></div>${links(encodeURIComponent(a.q||a.name))}</div>`;});}
  h+=`<div class="gtotal"><span>Still to buy</span><b>₹${Math.round(need)}</b></div><p class="fine">Full list estimate ₹${Math.round(total)}. Leafy greens wilt fast, so buy them in two rounds: Sunday and Wednesday.</p>
  <div class="row"><button class="btn" data-act="copy">Copy list</button><a class="btn ghost" style="text-decoration:none" href="https://wa.me/?text=${encodeURIComponent(listText())}" target="_blank" rel="noopener">Send on WhatsApp</a></div></section>
  <section class="section"><h2>Pantry check</h2><p>Not counted in cost. Make sure these are stocked:</p><div class="chips">${PANTRY.split(', ').map(x=>`<span class="chip">${x}</span>`).join('')}</div></section>`;
  return h;
}
function listText(){
  const G=groceries(); let t='Groceries for the week (2 people)\n';
  Object.keys(CATS).forEach(cat=>{const items=Object.entries(G.tot).filter(([id])=>ING[id].cat===cat&&!CHECK[id]); if(!items.length)return; t+='\n'+CATS[cat]+'\n'; items.forEach(([id,q])=>t+=`- ${ING[id].n}: ${fmtQty(id,q)}\n`);});
  const cu=G.custom.filter(c=>!CHECK['c:'+c.name.toLowerCase()]); if(cu.length){t+='\nFor our own dishes\n'; cu.forEach(c=>t+=`- ${c.name}: ${fmtCustomQty(c)}\n`);}
  const ad=G.adds.filter(x=>!CHECK['a:'+x.a.id]); if(ad.length){t+='\nAdd-ons\n'; ad.forEach(x=>t+=`- ${x.a.name.split(',')[0]}: ${x.n} servings\n`);}
  return t;
}

function renderPrep(){
  const days=P.days, nights={};
  const add=(dd,txt)=>{(nights[dd]=nights[dd]||[]).push(txt);};
  for(let d=0;d<7;d++) SLOTS.forEach(k=>{
    const it=days[d][k]; if(it.leftover)return; const r=RX[it.rid]; if(!r.soak)return;
    const q=(r.ing.find(x=>x[0]===r.soak.id)||[0,0])[1]*multFor(d,k);
    const nm=ING[r.soak.id].n.toLowerCase(), who=`for ${DAYS[d]}'s ${SLOTNAME[k].toLowerCase()}`;
    if(r.soak.type==='soak') add(Math.max(d-1,-1),`Soak ${fmtQty(r.soak.id,q)} ${nm} ${r.soak.txt}, ${who}`);
    if(r.soak.type==='marinate') add(Math.max(d-1,-1),`Marinate ${fmtQty(r.soak.id,q)} chicken in curd, lemon and tikka spices, ${who}`);
    if(r.soak.type==='oats') add(Math.max(d-1,-1),`Mix oats, milk and chia in two jars, ${who}`);
    if(r.soak.type==='sprout') add(Math.max(d-2,-1),`Soak ${fmtQty(r.soak.id,q)} whole moong; next morning drain and keep covered to sprout, ${who}`);
  });
  if(S.addons.some(a=>a.on&&a.id==='almond')) add(-1,'Soak almonds every night for the next morning');
  const nightLbl=i=>i===-1?'Sunday night (before Monday)':(DAYS[i]+' night');
  let nightsHtml=''; [-1,0,1,2,3,4,5].forEach(i=>{ if(nights[i]) nightsHtml+=`<li><span class="when">${nightLbl(i)}, 5 min</span>${nights[i].map(t=>`<b>${esc(t)}</b>`).join('')}</li>`; });
  let roti=0,curry=0,chutney=false,nuts=false,curd=0,tuber=false;
  days.forEach((day,d)=>SLOTS.forEach(k=>{const it=day[k]; if(it.leftover)return; const r=RX[it.rid]; const ids=r.ing.map(x=>x[0]);
    if(ids.some(x=>['atta','mgatta'].includes(x))&&d<2) roti++;
    if(r.slot==='m'&&ids.includes('onion')&&ids.includes('tomato')) curry++;
    if(ids.includes('mint')) chutney=true; if(ids.includes('makhana')||ids.includes('rchana')) nuts=true; if(ids.includes('curd')) curd++; if(ids.includes('shakarkandi')||ids.includes('bhutta')) tuber=true;}));
  const batch=[];
  if(curry>=2) batch.push(['Onion-tomato masala base, 20 min',`Cook down about ${Math.max(4,curry)} onions and ${Math.max(5,curry+1)} tomatoes with ginger-garlic and spices. Keeps 5 days in the fridge and saves about 10 minutes on each of this week's ${curry} curries.`]);
  batch.push(['Ginger-garlic paste, 5 min','Blend a small jar. Every dal and curry uses it.']);
  if(roti) batch.push(['Dough for Monday and Tuesday, 10 min','Knead atta once, store in an airtight box. Fresh rotis in 10 minutes each evening.']);
  batch.push(['Wash and chop vegetables for Mon to Wed, 15 min','Store in boxes lined with a paper towel. Chopping is the real time-killer on weekdays.']);
  if(chutney) batch.push(['Mint-coriander chutney, 5 min','Lasts 4 days and lifts chillas, wraps and salads.']);
  if(tuber) batch.push(['Boil shakarkandi or bhutta, 15 min','One cooker batch covers 2 to 3 evening snacks.']);
  if(nuts) batch.push(['Snack jars, 10 min','Roast makhana and peanuts, refill roasted chana. Grab-and-go for office.']);
  if(curd>=3) batch.push(['Set curd every night','This week uses curd in '+curd+' meals. Homemade is cheaper and thicker than packets.']);
  const tips=[
   ['Cook once, eat twice','With leftover mode on, dinner is a double batch and becomes the next day\'s tiffin. You cook 2 meals a day instead of 3.'+(S.leftover?' It is on.':' Turn it on in Setup.')],
   ['Pot-in-pot in the cooker','Dal at the bottom, rice in a steel dabba on top. One whistle cycle, two dishes.'],
   ['Split the work','One person chops while the other cooks. A 30-minute dinner drops to about 18.'],
   ['Lock in breakfasts','Keep 3 or 4 breakfasts on repeat. Variety matters more at lunch and dinner.'],
   ['Shop once, top up once','Big order on Sunday, a small greens and curd top-up on Wednesday.']
  ];
  return `<section class="section"><h2>Night-before list</h2><p>Small tasks so the morning is easy. Set a phone reminder at 10 pm.</p><ul class="steps">${nightsHtml||'<li>Nothing to soak this week.</li>'}</ul></section>
  <section class="section"><h2>Sunday batch prep, about an hour</h2><p>Done in this order, it covers most of the week's slow work.</p><ol class="steps">${batch.map(([a,b])=>`<li><b>${a}</b>${esc(b)}</li>`).join('')}</ol></section>
  <section class="section"><h2>Keeping it from becoming a chore</h2><ul class="steps">${tips.map(([a,b])=>`<li><b>${a}</b>${esc(b)}</li>`).join('')}</ul></section>`;
}

function renderSeason(){
  const used=new Set(); P.days.forEach(day=>SLOTS.forEach(k=>{const it=day[k]; if(it.veg)used.add(it.veg); if(it.fruit)used.add(it.fruit); RX[it.rid].ing.forEach(([id])=>used.add(id));}));
  const seasonal=cat=>Object.keys(ING).filter(id=>ING[id].m&&ING[id].cat===cat&&ING[id].m.length<12);
  const chip=id=>{const pf=S.prefs[id]; return `<button class="chip ${pf===1?'fav':pf===-1?'skip':used.has(id)?'used':''}" data-act="pref" data-id="${id}" aria-label="${esc(ING[id].n)}: ${pf===1?'more often':pf===-1?'skipped':'normal'}">${pf===1?'★ ':''}${esc(ING[id].n)}</button>`;};
  const inM=cat=>seasonal(cat).filter(id=>ING[id].m.includes(S.month));
  const outM=cat=>seasonal(cat).filter(id=>!ING[id].m.includes(S.month));
  const src=vcSources();
  return banner()+`<section class="section"><h2>In season: ${MONTHS[S.month-1]}</h2><p>North India calendar. Tap an item once to get it more often (★), again to skip it, a third time to reset. Green ones are in this week's plan.</p>
   <div class="field"><label for="mon2">Month</label><select id="mon2" data-set="month">${MONTHS.map((m,i)=>`<option value="${i+1}" ${S.month===i+1?'selected':''}>${m}</option>`).join('')}</select></div>
   <h3 class="gcat">Vegetables and greens</h3><div class="chips">${inM('veg').map(chip).join('')}</div>
   <h3 class="gcat">Fruits</h3><div class="chips">${inM('fruit').map(chip).join('')}</div>
   <details class="more"><summary>Getting something locally that isn't listed here?</summary><p class="fine">Star it and the planner treats it as in season for you.</p><div class="chips">${outM('veg').concat(outM('fruit')).map(chip).join('')}</div></details>
   <p class="fine">Papaya and banana are available all year and fill gaps.</p></section>
  <section class="section"><h2>Best vitamin C sources this month</h2><p>Daily need is about 80 mg for men and 65 mg for women. Eat these raw; cooking destroys a good part of it.</p>
   <ul class="steps">${src.slice(0,5).map(x=>`<li><b>${esc(x.t)}</b><span class="when">about ${x.mg} mg</span></li>`).join('')}</ul>
   ${!inSeason('amla')?`<p class="fine">Amla is out of season. Frozen amla, amla powder or a sugar-free amla juice work too; murabba has too much sugar to count.</p>`:''}</section>`;
}

function personForm(key){
  const p=S[key];
  return `<div class="person"><h3>${key==='a'?'Person 1':'Person 2'}</h3>
   <div class="two"><div class="field"><label>Name</label><input data-set="${key}.name" value="${esc(p.name)}"></div>
   <div class="field"><label>Weight (kg)</label><input type="number" inputmode="numeric" min="30" max="200" data-set="${key}.w" data-num value="${p.w}"></div></div>
   <div class="field"><label>Goal</label><select data-set="${key}.g" data-num>
     <option value="1" ${p.g==1?'selected':''}>Basic health (1.0 g protein per kg)</option>
     <option value="1.2" ${p.g==1.2?'selected':''}>Stay fit and active (1.2 g per kg)</option>
     <option value="1.6" ${p.g==1.6?'selected':''}>Lose fat or build muscle (1.6 g per kg)</option></select></div>
   <div class="three"><div class="field"><label>Fibre g/day</label><input type="number" inputmode="numeric" min="15" max="50" data-set="${key}.fib" data-num value="${p.fib}"></div>
   <div class="field"><label>Vit C mg/day</label><input type="number" inputmode="numeric" min="40" max="200" data-set="${key}.vc" data-num value="${p.vc}"></div>
   <div class="field"><label>Portion</label><select data-set="${key}.f" data-num>${[0.7,0.8,0.9,1,1.1,1.2,1.3].map(v=>`<option value="${v}" ${p.f==v?'selected':''}>${v}×</option>`).join('')}</select></div></div>
   <p class="fine">Protein target: ${targets(p).p} g a day.</p></div>`;
}
function addonRow(a,i){
  const paused=a.m&&!a.m.includes(S.month);
  return `<div class="addon"><input type="checkbox" data-set="addons.${i}.on" ${a.on?'checked':''} aria-label="Use ${esc(a.name)}">
   <div><div><b>${esc(a.name)}</b></div><div class="am">${a.p} g protein, ${a.f} g fibre, ${a.vc} mg vit C, about ₹${a.cost} each${paused?'. Out of season this month, paused':''}</div></div>
   <button class="linkbtn" data-act="deladdon" data-i="${i}">Remove</button>
   <div class="ctl"><select data-set="addons.${i}.per" data-num aria-label="Servings per day">${[1,2,3].map(v=>`<option value="${v}" ${a.per==v?'selected':''}>${v} a day</option>`).join('')}</select>
   <select data-set="addons.${i}.who" aria-label="Who takes it"><option value="both" ${a.who==='both'?'selected':''}>Both</option><option value="a" ${a.who==='a'?'selected':''}>${esc(S.a.name)}</option><option value="b" ${a.who==='b'?'selected':''}>${esc(S.b.name)}</option></select></div></div>`;
}
function renderSetup(){
  const seg=(k,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button data-act="seg" data-k="${k}" data-v="${v}" aria-pressed="${String(S[k])===String(v)}">${l}</button>`).join('')}</div>`;
  const mopts=sel=>MONTHS.map((m,i)=>`<option value="${i+1}" ${sel===i+1?'selected':''}>${m}</option>`).join('');
  const blocked=Object.keys(S.blocked).filter(id=>S.blocked[id]&&RX[id]);
  return banner()+`<section class="section"><h2>Your kitchen</h2><p>Changes to diet, month, time or leftovers make a fresh plan.</p>
   <div class="field"><label>Food preference</label>${seg('diet',[['veg','Veg'],['egg','Veg + eggs'],['nonveg','Non-veg']])}</div>
   <div class="field"><label>Max cooking time per meal on weekdays</label>${seg('cap',[[20,'20 min'],[30,'30 min'],[45,'45 min']])}</div>
   <div class="field"><label for="mon1">Month (for seasonal produce)</label><select id="mon1" data-set="month" data-num>${mopts(S.month)}</select></div>
   <div class="field"><label for="sv">Priority</label><input id="sv" type="range" min="0" max="1" step="0.1" data-set="save" data-num value="${S.save}"><div class="rangelbl"><span>More variety</span><span>Lower cost</span></div></div>
   <label class="switch"><span>Leftover mode: dinner doubles as next day's lunch</span><input type="checkbox" data-set="leftover" ${S.leftover?'checked':''}></label>
  </section>
  <section class="section"><h2>The two of you</h2><p>Portion size scales quantities and nutrition for each person.</p>${personForm('a')}${personForm('b')}</section>
  <section class="section"><h2>Daily add-ons</h2><p>Things you take every day on top of meals: whey, amla, nuts, seeds. They count toward each person's protein, fibre and vitamin C, and appear in the grocery list.</p>
   ${S.addons.map(addonRow).join('')||'<p class="fine">No add-ons yet.</p>'}
   <details class="more"><summary>Add your own</summary>
    <div class="field"><label>Name and serving</label><input id="ad_name" placeholder="e.g. Plant protein, 1 scoop"></div>
    <div class="three"><div class="field"><label>Protein g</label><input id="ad_p" type="number" inputmode="decimal" value="0"></div><div class="field"><label>Fibre g</label><input id="ad_f" type="number" inputmode="decimal" value="0"></div><div class="field"><label>Vit C mg</label><input id="ad_vc" type="number" inputmode="decimal" value="0"></div></div>
    <div class="three"><div class="field"><label>kcal</label><input id="ad_k" type="number" inputmode="decimal" value="0"></div><div class="field"><label>₹ per serving</label><input id="ad_cost" type="number" inputmode="decimal" value="0"></div><div class="field"><label>Who</label><select id="ad_who"><option value="both">Both</option><option value="a">${esc(S.a.name)}</option><option value="b">${esc(S.b.name)}</option></select></div></div>
    <button class="btn" data-act="addaddon">Add to daily add-ons</button></details>
  </section>
  <section class="section"><h2>Your own dishes</h2><p>Add something you already cook, like maa ke haath ka kadhi. The planner will mix it into the rotation.</p>
   ${S.custom.map((c,i)=>`<div class="addon" style="grid-template-columns:1fr auto"><div><b>${esc(c.name)}</b><div class="am">${({b:'Breakfast',m:'Lunch or dinner',s:'Snack'})[c.slot]}, ${c.p} g protein, ${c.f} g fibre, ${c.time} min</div></div><button class="linkbtn" data-act="delcustom" data-i="${i}">Remove</button></div>`).join('')}
   <details class="more"><summary>Add a dish</summary>
    <div class="field"><label>Dish name</label><input id="cd_name" placeholder="e.g. Kadhi with brown rice"></div>
    <div class="two"><div class="field"><label>Meal</label><select id="cd_slot"><option value="m">Lunch or dinner</option><option value="b">Breakfast</option><option value="s">Snack</option></select></div>
    <div class="field"><label>Type</label><select id="cd_diet"><option value="veg">Veg</option><option value="egg">Has eggs</option><option value="nonveg">Non-veg</option></select></div></div>
    <p class="fine">Per plate for one person. Rough numbers are fine; packet labels or any nutrition app help.</p>
    <div class="three"><div class="field"><label>Protein g</label><input id="cd_p" type="number" inputmode="decimal" value="15"></div><div class="field"><label>Fibre g</label><input id="cd_f" type="number" inputmode="decimal" value="6"></div><div class="field"><label>kcal</label><input id="cd_k" type="number" inputmode="decimal" value="450"></div></div>
    <div class="three"><div class="field"><label>Minutes</label><input id="cd_time" type="number" inputmode="numeric" value="30"></div><div class="field"><label>₹ per plate</label><input id="cd_cost" type="number" inputmode="decimal" value="40"></div><div class="field"><label>Vit C mg</label><input id="cd_vc" type="number" inputmode="decimal" value="10"></div></div>
    <div class="two"><div class="field"><label>Available from</label><select id="cd_m1"><option value="0">All year</option>${mopts(-1)}</select></div><div class="field"><label>Until</label><select id="cd_m2"><option value="0">All year</option>${mopts(-1)}</select></div></div>
    <div class="field"><label>Ingredients for 2 plates, one per line</label><textarea id="cd_ing" placeholder="Besan, 60 g&#10;Curd, 400 g&#10;Rice, 100 g"></textarea></div>
    <div class="field"><label>Steps (optional, one per line)</label><textarea id="cd_steps"></textarea></div>
    <button class="btn" data-act="addcustom">Add dish</button></details>
  </section>
  ${blocked.length?`<section class="section"><h2>Dishes you skipped</h2><p>These won't be suggested.</p><div class="chips">${blocked.map(id=>`<button class="chip" data-act="unblock" data-id="${id}">${esc(RX[id].name.replace('{veg}','seasonal').replace('{fruit}','fruit'))}, allow again</button>`).join('')}</div></section>`:''}
  <section class="section"><h2>About the numbers</h2><p class="fine" style="margin:0">Nutrition values are estimates for home-style cooking with about 1 to 1.5 tsp oil per dish; vitamin C allows for cooking losses. Prices are approximate city rates; check live prices in the apps. With whey, total daily protein above about 2 g per kg adds little. If either of you has a kidney or other medical condition, run the targets past a doctor or dietitian.</p></section>`;
}

function render(){
  renderTabs();
  document.getElementById('subtitle').textContent=`${MONTHS[S.month-1]} plan for ${S.a.name} and ${S.b.name}, ${S.diet==='veg'?'vegetarian':S.diet==='egg'?'veg with eggs':'non-veg'}`;
  const v=document.getElementById('view');
  v.innerHTML=TAB==='plan'?renderPlan():TAB==='shop'?renderShop():TAB==='prep'?renderPrep():TAB==='season'?renderSeason():renderSetup();
}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove('show'),1800);}

/* ---------- events ---------- */
const val=id=>document.getElementById(id).value;
const num=id=>parseFloat(val(id))||0;
function setPath(path,v){const ks=path.split('.');let o=S;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v;}
const REGEN_KEYS=['diet','month','cap','leftover'];
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return; const a=b.dataset.act;
  if(a==='tab'){TAB=b.dataset.tab;OPEN=null;render();window.scrollTo(0,0);}
  else if(a==='regen'){generate();render();toast('New plan ready');}
  else if(a==='toggle'){OPEN=OPEN===b.dataset.key?null:b.dataset.key;render();}
  else if(a==='swap'){swap(+b.dataset.d,b.dataset.k);}
  else if(a==='block'){const d=+b.dataset.d,k=b.dataset.k;S.blocked[P.days[d][k].rid]=true;OPEN=null;swap(d,k,true);toast('Dish skipped and replaced');}
  else if(a==='unblock'){delete S.blocked[b.dataset.id];DIRTY=true;save();render();}
  else if(a==='pref'){const id=b.dataset.id,c=S.prefs[id];if(c===undefined)S.prefs[id]=1;else if(c===1)S.prefs[id]=-1;else delete S.prefs[id];DIRTY=true;save();render();}
  else if(a==='seg'){const k=b.dataset.k;let v=b.dataset.v;if(k==='cap')v=+v;S[k]=v;generate();render();toast('Plan updated');}
  else if(a==='deladdon'){S.addons.splice(+b.dataset.i,1);save();render();}
  else if(a==='addaddon'){const name=val('ad_name').trim(); if(!name){toast('Give the add-on a name');return;}
    S.addons.push({id:'u'+Date.now(),name,p:num('ad_p'),f:num('ad_f'),vc:num('ad_vc'),k:num('ad_k'),cost:num('ad_cost'),who:val('ad_who'),per:1,on:true,q:name.split(',')[0]});save();render();toast('Add-on added');}
  else if(a==='delcustom'){const c=S.custom.splice(+b.dataset.i,1)[0];buildRecipes();if(P.days.some(day=>SLOTS.some(k=>day[k].rid===c.id)))generate();save();render();}
  else if(a==='addcustom'){const name=val('cd_name').trim(); if(!name){toast('Give the dish a name');return;}
    const m1=+val('cd_m1'),m2=+val('cd_m2');
    S.custom.push({id:'c'+Date.now(),name,slot:val('cd_slot'),diet:val('cd_diet'),p:num('cd_p'),f:num('cd_f'),k:num('cd_k'),c:0,fat:0,time:num('cd_time')||20,cost:num('cd_cost'),vc:num('cd_vc'),
      m:m1&&m2?R(m1,m2):null, ingC:val('cd_ing').split('\n').filter(x=>x.trim()).map(parseIng), steps:val('cd_steps').split('\n').filter(x=>x.trim())});
    buildRecipes();DIRTY=true;save();render();toast('Dish added');}
  else if(a==='copy'){const t=listText();
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('List copied'),()=>fallbackCopy(t));} else fallbackCopy(t);}
});
function fallbackCopy(t){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('List copied');}catch(e){toast('Copy failed, select manually');}ta.remove();}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.act==='check'){CHECK[t.dataset.id]=t.checked;save();render();return;}
  const path=t.dataset.set; if(!path)return;
  let v=t.type==='checkbox'?t.checked:t.value;
  if(t.hasAttribute('data-num')) v=parseFloat(v)||0;
  setPath(path,v);
  if(REGEN_KEYS.includes(path)){generate();toast('Plan updated');} else save();
  render();
});

load(); render();
</script>
